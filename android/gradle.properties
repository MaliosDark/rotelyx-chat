org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true

# No org.gradle.java.home here on purpose. A JDK path is a fact about one
# machine, so it belongs in ~/.gradle/gradle.properties, where Gradle also
# reads it and where it cannot break somebody else's clone. Java 17 is what
# this builds against; see docs/NATIVE.md.
