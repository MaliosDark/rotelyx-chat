name: rotelyx_chat
description: "Rotelyx Chat: a private messaging client by Ideoa Labs."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+9

environment:
  sdk: '>=3.4.4 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Everything this application imports, and nothing else.
  #
  # The message layer is `rotelyx-wasm`, served from web/rotelyx/ and reached
  # through web/rotelyx_bridge.js, not a pub package, so it appears here only
  # as the `web` binding used to talk to it and to the mailbox socket.
  #
  # Everything this application imports, and nothing else. No analytics, no
  # crash reporter, no font CDN, no push SDK, and nothing that wants a phone
  # number. Rotelyx has no account, no directory and no third party.
  web: ^1.1.1

  # `dart:ffi` gives pointers; this gives the Utf8 helpers and an allocator, and
  # is a Dart team package with no transitive dependencies. Only the native
  # build reaches it: `lib/rotelyx/engine/backend.dart` compiles
  # `engine/native.dart` out of a web build entirely.
  ffi: ^2.1.0
  get_storage: ^2.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

  # The encoder half of the QR pair. qr_flutter already pulls this in to draw
  # codes; naming it here lets test/qr_decode_test.dart encode a symbol and hand
  # it straight to lib/qr/decode.dart, which is what proves the decoder right.
  qr: ^3.0.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/

    # The two call tones, and only these two.
    #
    # The folder is not declared, for the reason below: Android plays its copy
    # as a resource and a second identical copy in every package is waste. iOS
    # has no resource system to copy them into, and adding them to the Xcode
    # target means editing `project.pbxproj` for a file rather than for a
    # feature. Declared as assets they arrive in the application bundle, where
    # `CallAudio.swift` finds them through `FlutterDartProject.lookupKey`.
    #
    # `message.wav` stays out. It is the notification sound, which on iOS is
    # played by the system from the notification itself and never by this
    # application.
    - assets/sound/connected.wav
    - assets/sound/failed.wav

    # `assets/sound/` is deliberately NOT declared.
    #
    # `tool/sound/build.py` writes the tone there and then copies it to
    # `android/app/src/main/res/raw/rotelyx_message.wav`, which is what the
    # notification channel plays: Android reads the sound for a channel as a
    # resource, never as a Flutter asset. Declaring the folder as well put a
    # second, identical copy in every package that nothing ever opened.
    #
    # The file stays on disk. It is the tool's output and the source the copy
    # is made from, and it is generated rather than downloaded because a licence
    # on a download page is a sentence somebody wrote, not a property of the
    # bytes.

  # Compiled to the platform's own shader format at build time and loaded with
  # FragmentProgram.fromAsset. Nothing is fetched: see shaders/burn.frag.
  shaders:
    - shaders/burn.frag

  # Fonts must be bundled, and this is not a preference.
  #
  # CanvasKit has no access to platform fonts. It ships a small set and fetches
  # the rest from fonts.gstatic.com on demand, which the CSP blocks, correctly,
  # since that request tells Google who is reading what. With nothing bundled the
  # result is not a fallback typeface: it is a screen with no text on it at all,
  # which is exactly how this build first rendered.
  #
  # DejaVu covers Latin, Cyrillic and Greek. The other two cover the scripts this
  # app ships translations for. All three are freely licensed.
  # Korean is NOT covered. The only system fonts with full Hangul are 19 MB CJK
  # collections, and subsetting one needs fontTools, which is not available here.
  # Droid Sans Fallback was tried and removed: it has U+AC00 but not U+D55C, so
  # real Korean text still rendered as tofu while costing 3.9 MB.
  fonts:
    # Manrope is the face the interface was drawn in.
    #
    # Five static instances cut from the variable original rather than the
    # variable file itself. Manrope's weight axis defaults to 200, its very
    # lightest, so shipping the variable file with no weight declared painted
    # the whole application in hairline ExtraLight and made it genuinely hard
    # to read. A declared weight per file is what lets Flutter resolve
    # FontWeight.w600 to a face that is actually semibold, including inside
    # Material widgets that never touch the Type scale below.
    - family: RotelyxSans
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    # Manrope covers Latin, Greek and Cyrillic. These three carry everything it
    # does not, and Flutter walks the list per glyph rather than per string, so
    # a Hindi word inside an English sentence still renders.
    - family: RotelyxWide
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: RotelyxDevanagari
      fonts:
        - asset: assets/fonts/Lohit-Devanagari.ttf
    - family: RotelyxArabic
      fonts:
        - asset: assets/fonts/KacstOne.ttf
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
